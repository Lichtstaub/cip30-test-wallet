name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit, node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm ci runs the prepare script, so dist/ is built from here on.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle:check
      - run: npm run pack:check

  package:
    name: packed CLI without Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack
        run: echo "TARBALL=$GITHUB_WORKSPACE/$(npm pack --silent | tail -n 1)" >> "$GITHUB_ENV"
      - name: Install the tarball into an empty project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install "$TARBALL"
          # The static doctor must work without the optional Playwright peer.
          test ! -e node_modules/@playwright/test
      - name: Static doctor finds the blocked eval on the strict demo
        run: |
          node examples/minimal-dapp/serve.mjs &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:4173/strict/ && break; sleep 0.5; done
          cd "$RUNNER_TEMP/consumer"
          set +e
          npx --no-install cip30-test-wallet doctor http://localhost:4173/strict/ --json > doctor.json
          code=$?
          set -e
          cat doctor.json
          test "$code" = 1
          node -e "const r = require('./doctor.json'); if (!r.findings.some((f) => f.id === 'eval-blocked')) process.exit(1)"

  browser:
    name: browser, ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      # Traces hold the wallet keys. They are the public CSL test vector, and the
      # artifact stays short-lived all the same.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  devnet:
    name: devnet, protocol 11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The same images as test-devnet/helpers/devnet.ts, pulled first so no test timeout covers the download.
      # Ogmios comes from Google's Docker Hub mirror, pinned to the digest of the Docker Hub tag, since
      # shared runners hit the anonymous Docker Hub pull limit. The local tag keeps the name the tests use.
      - name: Pull the devnet images
        run: |
          docker pull ghcr.io/intersectmbo/cardano-node:11.0.1
          docker pull mirror.gcr.io/cardanosolutions/ogmios@sha256:8892ef5f77b94f1c95427cf9f2b40e6235a32b27a8b1e378db02289f3991617f
          docker tag mirror.gcr.io/cardanosolutions/ogmios@sha256:8892ef5f77b94f1c95427cf9f2b40e6235a32b27a8b1e378db02289f3991617f cardanosolutions/ogmios:v7.0.0
      - run: npm ci
      - run: npm run test:devnet
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:devnet:browser
      - name: Devnet containers and volumes left behind
        if: always()
        run: |
          docker ps -a --filter name=chw-devnet
          docker volume ls --filter name=chw-devnet
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-devnet
          path: test-results/
          retention-days: 7
